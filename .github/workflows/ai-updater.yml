name: AI Code Auto-Updater

on:
  issues:
    types: [opened]

jobs:
  auto_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Process Issue with Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const prompt = process.env.ISSUE_BODY;
          const currentCode = fs.readFileSync("index.html", "utf8");

          const requestData = JSON.stringify({
            contents: [{
              parts: [{
                text: "أنت مبرمج خبير. عدل كود index.html التالي حسب طلب التعديل: \"" + prompt + "\". أرجع فقط الكود الجديد بالكامل بدون شروحات أو كتل markdown:\n\n" + currentCode
              }]
            }]
          });

          const options = {
            hostname: "generativelanguage.googleapis.com",
            path: "/v1beta/models/gemini-1.5-flash:generateContent?key=" + process.env.GEMINI_API_KEY,
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(requestData)
            }
          };

          const req = https.request(options, (res) => {
            let data = "";
            res.on("data", (chunk) => data += chunk);
            res.on("end", () => {
              try {
                const parsed = JSON.parse(data);
                let newCode = parsed.candidates[0].content.parts[0].text;
                newCode = newCode.replace(/^```html\s*/i, "").replace(/```$/i, "").trim();
                fs.writeFileSync("index.html", newCode);
                console.log("Updated index.html successfully.");
              } catch(e) {
                console.error("Failed to parse response:", data);
                process.exit(1);
              }
            });
          });

          req.on("error", (e) => {
            console.error(e);
            process.exit(1);
          });

          req.write(requestData);
          req.end();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini-Bot"
          git config --global user.email "bot@github.actions"
          git add index.html
          git commit -m "Auto-update index.html via Issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          comment: "تم تطبيق التعديلات وتحديث الموقع تلقائياً بنجاح ✅"
